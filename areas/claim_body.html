<style>
main.wrap{max-width:980px}
.cp-box{margin:28px 0 8px;padding:26px 24px;border-radius:22px;background:#15171C;color:#fff;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px 28px;border-top:0}
.cp-box .cp-k{margin:0 0 6px;font:700 12px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#E3B04B}
.cp-box .cp-t{margin:0;font:400 clamp(48px,11vw,72px)/1 Anton,Impact,sans-serif;letter-spacing:1px;font-variant-numeric:tabular-nums}
.cp-box .cp-s{margin:8px 0 0;font:500 16px/1.4 Inter,sans-serif;color:#C9CDD4}
.cp-go{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 26px;border-radius:14px;background:#E3B04B;color:#15171C;font:800 17px Inter,sans-serif;text-decoration:none;white-space:nowrap}
.cp-box.done .cp-t{color:#8A8F98}
.cp-head{padding:44px 0 10px;border-top:0}
.cp-head .cp-k{margin:0 0 12px;font:700 13px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.cp-head h1{font:800 clamp(34px,6vw,52px)/1.08 Inter,system-ui,sans-serif;text-transform:none;letter-spacing:-.025em}
.cp-head h1 span{color:var(--gold)}
.cp-head .sub{margin:16px 0 0}
.cl-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:30px 0 10px;border-top:0}
.cl-card{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:10px;padding:30px 28px;background:#fff;border:2px solid var(--line);border-radius:24px;cursor:pointer;color:var(--text);font:inherit;transition:border-color .15s,box-shadow .15s,transform .15s;-webkit-tap-highlight-color:transparent}
.cl-card:focus{outline:none}.cl-card:focus-visible{outline:3px solid rgba(181,130,31,.45);outline-offset:3px}
.cl-card:hover{transform:translateY(-2px);box-shadow:0 16px 34px -20px rgba(20,22,28,.35)}
.cl-card[aria-checked="true"]{border-color:var(--gold);box-shadow:0 0 0 6px rgba(181,130,31,.14)}
.cl-ico{width:58px;height:58px;border-radius:16px;background:var(--sand);color:var(--gold);display:grid;place-items:center;margin-bottom:8px}.cl-ico svg{width:28px;height:28px}
.cl-card b{font:800 24px/1.15 Inter,system-ui,sans-serif;letter-spacing:-.02em}
.cl-card em{font:700 17px Inter,sans-serif;font-style:normal;color:var(--gold)}
.cl-d{font:500 17px/1.55 Inter,sans-serif;color:var(--soft);flex:1}
.cl-btn{margin-top:14px;display:inline-flex;align-items:center;min-height:50px;padding:0 20px;border-radius:12px;border:1.5px solid #D9D3C8;font:700 16px Inter,sans-serif;background:#fff}
.cl-card[aria-checked="true"] .cl-btn{background:#15171C;border-color:#15171C;color:#fff}
.cl-card[aria-checked="true"] .cl-btn:before{content:"\2713\00a0"}
.cl-card[disabled]{opacity:.55;cursor:default;transform:none;box-shadow:none}
.cp-fine{padding:20px 0 60px;border-top:0;color:var(--soft);font-size:15px;text-align:center}
@media(max-width:720px){.cl-grid{grid-template-columns:1fr;gap:20px}.cl-card{padding:26px 22px}.cp-box{padding:24px 20px}.cp-go{width:100%}}
</style>
<section class="cp-box" id="cpBox" aria-live="polite">
  <div><p class="cp-k" id="cpK">Your personal offer</p><p class="cp-t" id="cpT">48:00:00</p><p class="cp-s" id="cpS">left to claim 1 free service</p></div>
  <a class="cp-go" href="#pick" id="cpGo">Claim mine</a>
</section>
<section class="cp-head">
  <p class="cp-k">Only for companies I sign</p>
  <h1>Pick 1 free service. <span>It goes in your package.</span></h1>
  <p class="sub">Free if we work together. Mention it on your audit call. One per company.</p>
</section>
<div class="cl-grid" id="pick" role="radiogroup" aria-label="Free services">
  <button type="button" class="cl-card" role="radio" aria-checked="false" data-svc="Referral program">
    <span class="cl-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="10" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M14.5 20c.2-2.3 1.4-4 3.5-4 1.9 0 3 1.3 3 4"/></svg></span>
    <b>Referral program</b><em>$900 value</em>
    <span class="cl-d">Realtors, inspectors and past customers sending you jobs, with every payout tracked.</span>
    <span class="cl-btn">Include in my package</span></button>
  <button type="button" class="cl-card" role="radio" aria-checked="false" data-svc="Past-customer comeback">
    <span class="cl-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/></svg></span>
    <b>Past-customer comeback</b><em>$750 value</em>
    <span class="cl-d">A campaign to customers you already served, so they book their next job with you.</span>
    <span class="cl-btn">Include in my package</span></button>
  <button type="button" class="cl-card" role="radio" aria-checked="false" data-svc="Review request system">
    <span class="cl-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></span>
    <b>Review request system</b><em>$400 value</em>
    <span class="cl-d">A review request after every job, so 5-star reviews come in without asking by hand.</span>
    <span class="cl-btn">Include in my package</span></button>
  <button type="button" class="cl-card" role="radio" aria-checked="false" data-svc="Google Business Profile tune-up">
    <span class="cl-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.3-7-11.5A7 7 0 0 1 19 9.5C19 14.7 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span>
    <b>Google Business Profile tune-up</b><em>$400 value</em>
    <span class="cl-d">Services, hours, photos and categories set up so you show up better in Maps.</span>
    <span class="cl-btn">Include in my package</span></button>
</div>
<p class="cp-fine">Your 48 hours start the first time you see this offer and never reset.</p>
